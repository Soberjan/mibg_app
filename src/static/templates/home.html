<html>
<head>
    <title>MIBG game</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/styles/base.css">
</head>
<body>
    <div class="page">
        <h1>Бизнес-игра </h1><h1>"Деньги и влияние"</h1>

        <div class="section">
            <button type="button" onclick="create_lobby()">Создать лобби</button>
        </div>

        <div class="section">
            <label for="lobby_id">Id лобби::</label>
            <input type="text" id="lobby_id" autocomplete="off" value=""/>
            <button type="button" onclick="join_lobby()">
                Присоединиться к лобби
            </button>
        </div>
    </div>

    <script>
        async function create_lobby() {
            const response = await fetch("/hostess/create_lobby",
                {method:"POST"});
            const result = await response.json();
            if (result.status == "ok") {
                let lobby_id = result.lobby_id;
                window.location.href=`/hostess/join_lobby?lobby_id=${lobby_id}`;
            }
        }

        async function join_lobby() {
            let lobby_id = document.getElementById("lobby_id").value;
            window.location.href=`/hostess/join_lobby?lobby_id=${lobby_id}`;
        }
    </script>
</body>
</html>
